name: Extract Portfolio ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          unzip -o syncra-phase10-seo-a11y.zip
          if [ -d syncra ]; then
            shopt -s dotglob
            mv syncra/* . || true
            rmdir syncra || true
          fi
          rm -f syncra-phase10-seo-a11y.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract portfolio project" || echo "Nothing to commit"
          git push